<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heal-Effekt</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 85%, #123a33 0%, #0a1a1f 60%, #070f14 100%);
    color: #d8efe6; font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  main { display: grid; gap: 2.5rem; justify-items: center; padding: 2rem 1rem; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 600; letter-spacing: .02em; }

  /* Bühne mit Ziel-Figur */
  .stage { position: relative; width: 160px; height: 240px; margin-top: 120px; }
  .hero {
    position: absolute; inset: 0; border-radius: 80px 80px 18px 18px;
    background: linear-gradient(#3b4b5a, #27323d);
    box-shadow: inset 0 -12px 24px rgba(0,0,0,.35);
  }
  .fx { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }

  /* Boden-Ring */
  .ring {
    position: absolute; left: 50%; bottom: -14px; width: 200px; height: 44px; margin-left: -100px;
    border-radius: 50%; border: 2px solid #6dffa8;
    box-shadow: 0 0 18px #3dff8a, inset 0 0 18px rgba(61,255,138,.5);
    opacity: 0; animation: ring 1.1s ease-out forwards;
  }
  @keyframes ring {
    0%   { transform: scale(.3); opacity: 0; }
    25%  { opacity: .9; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  /* "+"-Partikel: außen steigt es auf und verblasst, innen pulsiert es */
  .plus {
    position: absolute; bottom: 0; left: var(--x);
    width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2);
    opacity: 0; animation: rise var(--d) cubic-bezier(.2,.6,.3,1) var(--delay) forwards;
  }
  .plus i {
    display: block; width: 100%; height: 100%;
    background:
      linear-gradient(#8bffbd, #8bffbd) center / 34% 100% no-repeat,
      linear-gradient(#8bffbd, #8bffbd) center / 100% 34% no-repeat;
    filter: drop-shadow(0 0 4px #3dff8a) drop-shadow(0 0 10px rgba(61,255,138,.8));
    animation: pulse .55s ease-in-out infinite alternate;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: 1; }
    65%  { opacity: .9; }
    100% { transform: translate(var(--dx), calc(var(--h) * -1)); opacity: 0; }
  }
  @keyframes pulse {
    from { transform: scale(.75); }
    to   { transform: scale(1.2); }
  }

  /* Bedienung */
  .controls { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 600; padding: .7rem 1.4rem; border-radius: 999px; cursor: pointer;
    color: #0a1a1f; background: #6dffa8; border: 2px solid #6dffa8;
    transition: transform .12s ease, background .12s ease;
  }
  button:active { transform: scale(.96); }
  button.ghost { background: transparent; color: #6dffa8; }
  button[aria-pressed="true"] { background: #6dffa8; color: #0a1a1f; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .plus i { animation: none; }
    .ring { animation-duration: .01s; }
  }
</style>
</head>
<body>
<main>
  <h1>Heal-Effekt</h1>
  <div class="stage" id="stage">
    <div class="hero"></div>
    <div class="fx" id="fx"></div>
  </div>
  <div class="controls">
    <button id="once">Heilen</button>
    <button id="loop" class="ghost" aria-pressed="false">Dauerheilung</button>
  </div>
</main>

<script>
  const fx = document.getElementById('fx');
  const rand = (min, max) => min + Math.random() * (max - min);

  // Spawnt eine Welle aus "+"-Symbolen am unteren Rand des Containers.
  function heal(container, { count = 14, width = 160 } = {}) {
    const ring = document.createElement('div');
    ring.className = 'ring';
    container.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'plus';
      p.style.setProperty('--x',     rand(8, width - 8) + 'px');
      p.style.setProperty('--s',     rand(14, 30) + 'px');
      p.style.setProperty('--h',     rand(110, 230) + 'px');
      p.style.setProperty('--dx',    rand(-18, 18) + 'px');
      p.style.setProperty('--d',     rand(1.1, 1.9) + 's');
      p.style.setProperty('--delay', rand(0, 0.7) + 's');
      p.appendChild(document.createElement('i'));
      p.addEventListener('animationend', e => { if (e.target === p) p.remove(); });
      container.appendChild(p);
    }
  }

  document.getElementById('once').addEventListener('click', () => heal(fx));

  let timer = null;
  const loopBtn = document.getElementById('loop');
  loopBtn.addEventListener('click', () => {
    const on = loopBtn.getAttribute('aria-pressed') !== 'true';
    loopBtn.setAttribute('aria-pressed', on);
    clearInterval(timer);
    if (on) { heal(fx, { count: 8 }); timer = setInterval(() => heal(fx, { count: 8 }), 800); }
  });

  heal(fx); // einmal beim Laden zeigen
</script>
</body>
</html>
